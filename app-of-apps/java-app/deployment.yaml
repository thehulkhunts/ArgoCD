apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-app-of-apps
  namespace: java-app
  labels:
    app: argocd-deploys-app-of-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io: argocd-app-of-apps
      version: v1.0.0
  template:
    metadata:
      labels:
        app.kubernetes.io: argocd-app-of-apps
        version: v1.0.0
    spec:
      containers:
      - name: java-app
        image: vinayjadhav/java-app:v1.0.0
        ports:
          - containerPort: 8080
        resources:
          limits:
            cpu: "512m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"

        